name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Directory (www)
        run: |
          mkdir -p www
          cp -r index.html css js assets www/

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Apply App Icon & Splash
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          RES="android/app/src/main/res"

          if [ -f "assets/icon.png" ]; then
            # Hapus adaptive vector icon bawaan Capacitor
            rm -rf $RES/mipmap-anydpi-v26
            rm -f $RES/drawable/ic_launcher_foreground.xml
            rm -f $RES/drawable-v24/ic_launcher_foreground.xml

            mkdir -p $RES/mipmap-mdpi $RES/mipmap-hdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi

            convert assets/icon.png -resize 48x48 $RES/mipmap-mdpi/ic_launcher.png
            convert assets/icon.png -resize 48x48 $RES/mipmap-mdpi/ic_launcher_round.png

            convert assets/icon.png -resize 72x72 $RES/mipmap-hdpi/ic_launcher.png
            convert assets/icon.png -resize 72x72 $RES/mipmap-hdpi/ic_launcher_round.png

            convert assets/icon.png -resize 96x96 $RES/mipmap-xhdpi/ic_launcher.png
            convert assets/icon.png -resize 96x96 $RES/mipmap-xhdpi/ic_launcher_round.png

            convert assets/icon.png -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
            convert assets/icon.png -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher_round.png

            convert assets/icon.png -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png
            convert assets/icon.png -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher_round.png
          fi

          if [ -f "assets/splash.png" ]; then
            mkdir -p $RES/drawable
            convert assets/splash.png $RES/drawable/splash.png || true
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: MeowKAS Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
